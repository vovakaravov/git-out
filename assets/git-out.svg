<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="tile-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#18202c"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="escape-glow" x1="0" y1="0.5" x2="1" y2="0.5">
      <stop offset="0%" stop-color="#3fb950" stop-opacity="0.26"/>
      <stop offset="100%" stop-color="#3fb950" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="escape-branch" x1="50" y1="74" x2="104" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="48%" stop-color="#39c5cf"/>
      <stop offset="100%" stop-color="#3fb950"/>
    </linearGradient>
  </defs>

  <!-- App badge tile matching Primer Dark canvas -->
  <rect x="4" y="4" width="120" height="120" rx="26" fill="url(#tile-bg)" stroke="#30363d" stroke-width="3"/>

  <!-- Subtle emerald exit spill through the open doorway -->
  <polygon points="73,45 114,29 114,99 73,83" fill="url(#escape-glow)"/>

  <!-- Open door leaf hinged on the left -->
  <path d="M 27 26 L 40 33 L 40 95 L 27 102 Z" fill="#262c36" stroke="#444c56" stroke-width="2.5" stroke-linejoin="round"/>
  <circle cx="36" cy="64" r="2.2" fill="#adbac7"/>

  <!-- Crisp open doorway frame with wide right-side exit gap -->
  <path d="M 72 42 L 72 24 L 26 24 L 26 104 L 72 104 L 72 86"
        fill="none" stroke="#e6edf3" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Git commit trunk inside the doorway -->
  <line x1="53" y1="40" x2="53" y2="88" stroke="#58a6ff" stroke-width="5.5" stroke-linecap="round"/>

  <!-- Escaping branch shooting out through the open doorway -->
  <path d="M 53 76 C 53 64, 62 64, 73 64 L 101 64"
        fill="none" stroke="url(#escape-branch)" stroke-width="6.5" stroke-linecap="round"/>
  <path d="M 90 52 L 104 64 L 90 76"
        fill="none" stroke="#3fb950" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Hollow commit nodes on the trunk -->
  <circle cx="53" cy="40" r="6" fill="#0d1117" stroke="#58a6ff" stroke-width="4.5"/>
  <circle cx="53" cy="87" r="6" fill="#0d1117" stroke="#58a6ff" stroke-width="4.5"/>
</svg>
